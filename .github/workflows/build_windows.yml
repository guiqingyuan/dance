name: Build Windows EXE

# 手动触发 或 推送到 main 分支时自动触发
on:
  push:
    branches: [main, master]
    paths:
      - 'tools/**'
      - 'A1Z_Flange/meshes/**'
      - '.github/workflows/build_windows.yml'
  workflow_dispatch:   # 允许在 GitHub 网页手动点击运行

jobs:
  build:
    runs-on: windows-latest   # GitHub 免费 Windows 云机器

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi "uvicorn[standard]" pillow mujoco numpy h11 websockets anyio

      - name: Verify MuJoCo render (non-fatal)
        run: |
          python -c "
          import os, mujoco
          m = mujoco.MjModel.from_xml_string('<mujoco><worldbody/></mujoco>')
          d = mujoco.MjData(m)
          for backend in ['egl', 'osmesa', None]:
              try:
                  if backend:
                      os.environ['MUJOCO_GL'] = backend
                  else:
                      os.environ.pop('MUJOCO_GL', None)
                  r = mujoco.Renderer(m, 64, 64)
                  r.update_scene(d)
                  print('Render OK backend=%s shape=%s' % (backend, r.render().shape))
                  break
              except Exception as e:
                  print('Backend %s failed: %s' % (backend, e))
          else:
              print('No GL backend available - placeholder will be used')
          "
        continue-on-error: true

      - name: Build with PyInstaller
        working-directory: tools
        run: |
          pyinstaller --clean --noconfirm choreo_server.spec

      - name: Create choreographies folder
        run: |
          mkdir -p tools/dist/A1Z/choreographies

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: A1Z-Windows
          path: tools/dist/A1Z/
          retention-days: 30   # 保留 30 天
